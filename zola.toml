# The URL the site will be built for
base_url = "https://louis.thomasgirardey.fr"

build_search_index = false
compile_sass = true
minify_html = false  #TODO: re-enable when https://github.com/getzola/zola/issues/3302 will be fixed

theme = "apollo-portfolio"

default_language = "en"

# To add a language, add a line here first.
# This is needed for zola to generate files at /it (for example).
# Then create the menu in [extra.xx].
# Then translate **all** your content (e.g _index.md -> _index.xx.md).
# Comment all lines to disable other languages
[languages.fr.translations]
# [languages.it.translations]

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"
error_on_missing_language = true

[extra]
# Title defined here in order to be available in all languages
title = "Louis THOMAS-GIRARDEY"
copyright = "Louis THOMAS-GIRARDEY"
favicon = "/icons/favicon.ico"

repo_url = "https://github.com/louis-tg/portfolio/"
repo_view = false

allow_missing_translation_pages = false
allow_missing_translation_sections = false

toc = true
theme = "toggle"              # light, dark, auto, toggle, toggle-auto
fancy_code = false
dynamic_note = true           # a note that can be toggled
mathjax = false

socials = [
    { name = "github", url = "https://github.com/lasercata", icon = "github" },
    { name = "linkedin", url = "https://linkedin.com/in/louis-tg", icon = "linkedin" },
    { name = "email", url = "mailto:louis@thomasgirardey.fr", icon = "email" },
]

[extra.analytics]
enabled = true

# [extra.analytics.goatcounter]
# user = "your_user"
# host = "example.com" # default= goatcounter.com
#
[extra.analytics.umami]
website_id = "d29bbbe3-c6fc-42cf-870f-ccc66011788a"
host_url = "https://umami.lasercata.com" # default: https://api-gateway.umami.dev/

[extra.en]
menu = [
    { name = "Home", url = "/", weight = 0 },
    { name = "Projects", url = "/projects", weight = 1 },
    # { name = "About", url = "/about", weight = 2 },
    { name = "Contact", url = "/contact", weight = 3 },
]

[extra.fr]
menu = [
    { name = "Accueil", url = "/fr/", weight = 0 },
    { name = "Projets", url = "/fr/projects", weight = 1 },
    # { name = "À propos", url = "/fr/about", weight = 2 },
    { name = "Contact", url = "/fr/contact", weight = 3 },
]

